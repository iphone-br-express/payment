<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dados de entrega — iPhone Express</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"></head>
<body><div class="topbar"><span>iPhone Express</span><span>Etapa 2 de 3 • Dados de entrega</span></div><header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/logo.png" alt="iPhone Express"><span>iPhone <b>EXPRESS</b></span></a><div class="steps"><span class="done">1 Produto</span><span class="active">2 Entrega</span><span>3 Pagamento</span></div></div></header>
<main class="container checkout-page"><div id="error" class="message error hidden"></div><div class="checkout-layout"><section class="form-card"><span class="eyebrow">DADOS DO CLIENTE</span><h1>Para onde vamos enviar?</h1><p>Preencha os dados exatamente como deseja receber o pedido. A cor escolhida fica registrada no pedido.</p><form id="form"><div class="form-grid"><label>Nome completo<input id="name" required autocomplete="name"></label><label>E-mail<input id="email" type="email" required autocomplete="email" placeholder="voce@email.com"></label><label>CPF<input id="cpf" inputmode="numeric" maxlength="14" required autocomplete="off"></label><label>Celular / WhatsApp<input id="phone" inputmode="tel" required autocomplete="tel" placeholder="(00) 00000-0000"></label><label>CEP<input id="cep" inputmode="numeric" maxlength="9" required autocomplete="postal-code"></label><label class="wide">Endereço<input id="street" required autocomplete="street-address"></label><label>Número<input id="number" required></label><label>Complemento<input id="complement"></label><label>Bairro<input id="neighborhood" required></label><label>Cidade<input id="city" required autocomplete="address-level2"></label><label>UF<select id="state" required><option value="">Selecione</option><option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option></select></label><label class="wide">Referência (opcional)<input id="reference"></label></div><button class="buy submit" type="submit">OK, continuar para pagamento →</button></form></section><aside class="summary-card"><div id="summary">Carregando...</div></aside></div></main><script src="catalog-fallback.js"></script><script src="checkout.js"></script></body></html>
